[project]
name = "telco-churn-mlops"
version = "0.1.0"
description = "Production-style MLOps workflow for Telco Customer Churn"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
	"evidently>=0.7.17",
	"fastapi>=0.136.1",
	"matplotlib>=3.10.9",
	"mlflow>=3.4",
	"pandas>=3.0.3",
	"scikit-learn>=1.8.0",
	"seaborn>=0.13.2",
	"uvicorn[standard]>=0.46.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
